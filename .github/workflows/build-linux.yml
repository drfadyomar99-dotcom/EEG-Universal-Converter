
name: Build EEG Universal Converter AppImage

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            file

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Build Linux executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name EEGUniversalConverter \
            --add-data "assets:assets" \
            --collect-all mne \
            --collect-all edfio \
            --collect-all eeglabio \
            --collect-all pybv \
            --hidden-import scipy.io \
            --hidden-import conversion_bundle \
            --hidden-import edf_export \
            --hidden-import multiformat \
            app.py

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p EEGUniversalConverter.AppDir/usr/bin

          cp -a dist/EEGUniversalConverter/. \
            EEGUniversalConverter.AppDir/usr/bin/

          cat > EEGUniversalConverter.AppDir/AppRun <<'EOF'
          #!/usr/bin/env bash
          APP_DIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"
          exec "$APP_DIR/usr/bin/EEGUniversalConverter" "$@"
          EOF

          chmod +x EEGUniversalConverter.AppDir/AppRun

          cat > EEGUniversalConverter.AppDir/EEGUniversalConverter.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=EEG Universal Converter
          Comment=EEG data conversion and validation
          Exec=EEGUniversalConverter
          Icon=EEGUniversalConverter
          Terminal=false
          Categories=Science;Education;
          StartupWMClass=EEGUniversalConverter
          EOF

          python - <<'PY'
          from PIL import Image

          image = Image.open(
              "assets/EEGUniversalConverter.ico"
          )
          image = image.convert("RGBA")
          image.save(
              "EEGUniversalConverter.AppDir/EEGUniversalConverter.png"
          )
          PY

      - name: Download AppImage packaging tool
        shell: bash
        run: |
          curl -fL --retry 3 \
            -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        shell: bash
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./appimagetool-x86_64.AppImage \
            EEGUniversalConverter.AppDir \
            EEGUniversalConverter-x86_64.AppImage

          test -s EEGUniversalConverter-x86_64.AppImage
          chmod +x EEGUniversalConverter-x86_64.AppImage

          file EEGUniversalConverter-x86_64.AppImage

      - name: Upload final AppImage
        uses: actions/upload-artifact@v4
        with:
          name: EEGUniversalConverter-Ubuntu-AppImage
          path: EEGUniversalConverter-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
